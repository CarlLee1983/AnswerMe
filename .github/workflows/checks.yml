name: Checks

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_ARTIFACT_DIR: site-check

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 取得 skill validator
        # 固定 commit SHA 與來源說明見 scripts/fetch-validator.sh，release.yml 共用同一支。
        run: sh scripts/fetch-validator.sh "$RUNNER_TEMP/quick_validate.py"
      - name: 安裝檢查依賴
        run: python -m pip install -r requirements-check.txt
      - name: 快速檢查
        run: python scripts/check.py
        env:
          SKILL_VALIDATOR: ${{ runner.temp }}/quick_validate.py
      - name: 網站瀏覽器檢查
        run: node tests/answer-me/browser/verify-site.mjs site "$SITE_ARTIFACT_DIR"
      - name: 上傳瀏覽器檢查輸出
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-check
          path: ${{ env.SITE_ARTIFACT_DIR }}
          if-no-files-found: warn
