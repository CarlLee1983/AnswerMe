name: Release

on:
  push:
    tags: ["v*"]

# 只給建立 Release 所需的權限。
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # 發布檢查要比對範例頁標示的版本是否為已存在的 tag，需要取回所有 tag。
          fetch-depth: 0
      - name: 還原 annotated tag 物件
        # checkout 在 tag 推送時可能只留下指向 commit 的輕量 tag（actions/checkout#290），
        # 讓「必須是 annotated tag」的檢查誤判；強制重新抓取 tag ref 以取得真正的 tag 物件。
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 取得 skill validator
        run: sh scripts/fetch-validator.sh "$RUNNER_TEMP/quick_validate.py"
      - name: 安裝檢查依賴
        run: python -m pip install -r requirements-check.txt
      - name: 發布模式檢查
        run: python scripts/check.py --release "$TAG"
        env:
          SKILL_VALIDATOR: ${{ runner.temp }}/quick_validate.py
      - name: 建立 GitHub Release
        # --notes-from-tag 讀本機 annotated tag 的訊息（會剝除簽章），不另外處理 tag 內容。
        # 不重跑瀏覽器檢查，以 master 的 CI 結果為準。
        run: gh release create "$TAG" --verify-tag --title "Answer Me $TAG" --notes-from-tag
        env:
          GH_TOKEN: ${{ github.token }}
